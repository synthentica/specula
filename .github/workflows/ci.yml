name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Includes the end-to-end capture test, which drives the runner's Chrome.
      - run: npm test
        env:
          SPECULA_CHROME: /usr/bin/google-chrome
      # Every rebuild against its recorded flows; no Docker or network needed.
      - run: npm run demo
